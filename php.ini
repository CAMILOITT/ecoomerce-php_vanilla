[PHP]
; Configuración general de PHP

; === Carga de extensiones ===
; Nota: xdebug se carga automáticamente a través de la configuración del sistema  
; extension=xdebug  ; (comentado - se carga automáticamente desde /etc/php/8.3/mods-available/)

[xdebug]
; === Configuración de XDebug ===

; Habilitar y configurar el modo de XDebug
; "debug" - Para debugging remoto
; "profile" - Para profiling
; "trace" - Para tracing
; "coverage" - Para code coverage
zend_extension=xdebug.so
xdebug.mode=develop,debug
xdebug.start_with_request=yes
xdebug.client_port=8000
xdebug.client_host=localhost

; Directorio base del servidor para depuración de rutas
xdebug.file_link_format=vscode://file/%f:%l

; Nivel de detalle del log (0 = deshabilitado, 1 = errores, 2 = advertencias, 3 = debug)
xdebug.log_level=0

; Archivo de log de XDebug (opcional)
; xdebug.log=/tmp/xdebug.log

; === Configuración adicional ===

; Mostrar errores de PHP
display_errors=1
error_reporting=E_ALL

; Zona horaria
date.timezone=America/Bogota

; Límite de tiempo de ejecución (en segundos)
max_execution_time=300

; Tamaño máximo de upload
upload_max_filesize=100M
post_max_size=100M

; Configuración de sesiones
session.gc_maxlifetime=3600
